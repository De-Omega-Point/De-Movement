<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>De-Movement Press Lab</title><style>body{font:16px system-ui;background:#10251f;color:#f3fff4;margin:0}main{max-width:900px;margin:auto;padding:20px}h1{font-size:clamp(32px,7vw,56px);color:#c5ff79}button,select,input{font:inherit;border-radius:10px;padding:10px;border:1px solid #69977b;background:#244938;color:white;min-height:44px}button{cursor:pointer}button.active{background:#c5ff79;color:#10251f;font-weight:bold}.card{background:#1d3a30;border:1px solid #507d62;padding:17px;border-radius:18px;margin:14px 0}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.exercise{border-top:1px solid #4a745d;padding:15px 0}.exercise input[type=checkbox]{width:24px;height:24px;vertical-align:middle;accent-color:#baff67}.exercise input[type=number]{width:80px}.tip{color:#c5ff79}#clock{font-size:55px;font-weight:900;font-variant-numeric:tabular-nums;color:#c5ff79}.chart{display:flex;align-items:end;height:190px;gap:7px}.bar{flex:1;background:#94e4a4;min-height:2px;text-align:center;color:#10251f;font-size:11px}.muted{color:#b7d1c1}button:focus-visible,input:focus-visible{outline:3px solid white}</style><main><p><a style="color:#c5ff79" href="../index.html">← De-Movement</a></p><h1>Press Lab ⚡</h1><p>12-week weighted gym and press-to-handstand training. Check off exercises, log your weights and track progress. Local-first.</p><div class="card"><strong>⏱ Rest timer</strong><div id="clock">01:30</div><div class="row" id="presets"><button data-t="30">30s</button><button data-t="60">60s</button><button data-t="90" class="active">90s</button><button data-t="120">2m</button><button data-t="180">3m</button></div><p class="row"><button id="play" class="active">▶ Start</button><button id="reset">Reset</button><button id="plus">+30s</button></p><p id="status" class="muted">Ready</p></div><div class="row"><button id="work" class="active">Workout</button><button id="charts">Charts</button><button id="road">12-week roadmap</button><button id="export">Export JSON</button><label>Import <input type="file" id="import" accept=".json"></label></div><section id="content"></section><p class="muted">Weeks 4, 8 and 12: reduce hard sets by 30–40%. Avoid sharp pain and allow recovery between demanding wrist sessions.</p></main><script>
const days={
Monday:[['Wrist + shoulder warm-up','Mat','8 min','Move slowly in a comfortable range.'],['Dumbbell overhead press','Dumbbells','3 × 8–10','Keep ribs stacked; 2–3 reps in reserve.'],['Cable serratus punch','Cable','3 × 12/side','Reach with the shoulder blade.'],['Pike push-up','Floor','3 × 6–8','Keep hips high.'],['Chest-to-wall handstand','Wall','3 × 20–40s','Push tall through straight elbows.'],['Reverse wrist curl','Dumbbells','2 × 12–15','Use a light load and slow lowering.']],
Tuesday:[['Active hip mobility','Mat','6 min','Control the range.'],['Cable hip flexion','Cable + ankle strap','3 × 10/leg','Avoid rocking the pelvis.'],['Romanian deadlift','Barbell','3 × 8','Hinge at hips.'],['Seated leg curl','Machine','3 × 10–12','Control the lowering.'],['Hip adduction','Machine','2 × 12','Comfortable range only.'],['Seated pike leg lifts','Blocks','3 × 8–12','Straight knees; no swinging.'],['Pancake good mornings','Mat','2 × 10','Hinge from hips.']],
Thursday:[['Wrist + shoulder prep','Mat','8 min','Warm up before loading.'],['Elevated pike weight shifts','Box','4 × 4–5','Shift forwards until feet lighten.'],['Assisted straddle press','Box / spotter','4 × 2','Do not jump.'],['Wall toe pulls','Wall','3 × 3','Use fingertips for balance.'],['Light overhead press','Dumbbells','2 × 8','Keep lighter than Monday.'],['Cable serratus punch','Cable','2 × 12','Control shoulder blades.'],['Compression drills','Blocks','8 min','Lift actively.']],
Saturday:[['Gentle wrist prep','Mat','5 min','Avoid painful end range.'],['Wrist curl','Dumbbells','2 × 12–15','Slow and light.'],['Reverse wrist curl','Dumbbells','2 × 12–15','Controlled lowering.'],['Forearm rotation','Dumbbell','2 × 10/side','Support elbow.'],['Farmer carry','Dumbbells','3 × 30s','Stay tall.'],['Straddle leg lifts','Blocks','3 × 10','Keep knees straight.'],['Active hip mobility','Mat','10 min','Do not force stretching.']]};
const KEY='de-movement-press-lab-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.logs=state.logs||{};state.week=state.week||1;state.day=state.day||'Monday';let tab='work';const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),key=(w,d,i)=>w+'|'+d+'|'+i,record=(w,d,i)=>state.logs[key(w,d,i)]||{},pct=w=>{let a=0,b=0;Object.keys(days).forEach(d=>days[d].forEach((_,i)=>{b++;if(record(w,d,i).done)a++}));return Math.round(100*a/b)};function render(){document.querySelectorAll('#work,#charts,#road').forEach(x=>x.classList.toggle('active',x.id===tab));if(tab==='work'){let d=state.day;$('#content').innerHTML='<div class="card"><div class="row"><label>Week <select id="week">'+Array.from({length:12},(_,i)=>'<option '+(state.week===i+1?'selected':'')+'>'+(i+1)+'</option>').join('')+'</select></label><label>Day <select id="day">'+Object.keys(days).map(x=>'<option '+(d===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div><h2>'+d+' · '+pct(state.week)+'% complete</h2>'+days[d].map((e,i)=>{let v=record(state.week,d,i);return '<div class="exercise"><label><input type="checkbox" data-i="'+i+'" data-f="done" '+(v.done?'checked':'')+'> <strong>'+e[0]+'</strong></label><p class="muted">'+e[1]+' · '+e[2]+'</p><div class="row"><label>Weight kg <input type="number" min="0" step=".5" data-i="'+i+'" data-f="kg" value="'+(v.kg||'')+'"></label><label>Actual reps/time <input data-i="'+i+'" data-f="reps" value="'+(v.reps||'')+'"></label></div><details><summary>💡 Pro-tip</summary><p class="tip">'+e[3]+'</p></details></div>'}).join('')+'</div>';$('#week').onchange=e=>{state.week=+e.target.value;save();render()};$('#day').onchange=e=>{state.day=e.target.value;save();render()};document.querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{let k=key(state.week,d,+el.dataset.i);state.logs[k]={...state.logs[k],[el.dataset.f]:el.type==='checkbox'?el.checked:el.value};save();if(el.dataset.f==='done')render()})}else if(tab==='charts'){$('#content').innerHTML='<div class="card"><h2>Weekly completion</h2><div class="chart">'+Array.from({length:12},(_,i)=>'<div class="bar" style="height:'+Math.max(2,pct(i+1)*1.5)+'px" title="Week '+(i+1)+': '+pct(i+1)+'%">'+(i+1)+'</div>').join('')+'</div><p class="muted">Bar height shows percentage of exercises completed.</p></div><div class="card"><h2>Overhead press · kg per dumbbell</h2>'+Array.from({length:12},(_,i)=>'<p>Week '+(i+1)+': '+(record(i+1,'Monday',1).kg||'Not recorded')+'</p>').join('')+'</div>'}else{$('#content').innerHTML='<div class="card"><h2>12-week roadmap</h2>'+Array.from({length:12},(_,i)=>'<p>Week '+(i+1)+' · '+(i===3||i===7||i===11?'Deload and reassess':i<4?'Foundation':i<8?'Strength':'Press integration')+' · '+pct(i+1)+'%</p>').join('')+'</div>'}}
['work','charts','road'].forEach(t=>$('#'+t).onclick=()=>{tab=t;render()});$('#export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='press-lab-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('#import').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.logs||typeof x.logs!=='object')throw Error('Invalid backup');if(confirm('Replace local training records?')){state=x;save();render()}}catch{alert('Invalid backup file')}};let duration=90,left=90,end=0,running=false,timer;function paint(){$('#clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('#play').textContent=running?'Pause':'▶ Start'}function tick(){if(running){left=Math.max(0,Math.ceil((end-Date.now())/1000));if(!left){running=false;clearInterval(timer);$('#status').textContent='✓ Rest complete'}paint()}}$('#play').onclick=()=>{if(running){tick();running=false;clearInterval(timer)}else{if(!left)left=duration;end=Date.now()+left*1000;running=true;timer=setInterval(tick,250);$('#status').textContent='Counting down'}paint()};$('#reset').onclick=()=>{running=false;clearInterval(timer);left=duration;$('#status').textContent='Ready';paint()};$('#plus').onclick=()=>{if(running)end+=30000;else left+=30;tick();paint()};document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{duration=+b.dataset.t;left=duration;running=false;clearInterval(timer);document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('active',x===b));paint()});document.addEventListener('visibilitychange',tick);render();paint();
</script></html>
